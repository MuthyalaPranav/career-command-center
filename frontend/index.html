<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Career Command Center helps you analyze job descriptions, improve your resume, and manage saved versions." />
    <title>Career Command Center</title>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('career-workspace-theme'); } catch {}
        document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
          ? theme : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      })();
    </script>
    <style>
      html { color-scheme: dark; background: #080D19; }
      html[data-theme="light"] { color-scheme: light; background: #F8FAFC; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
